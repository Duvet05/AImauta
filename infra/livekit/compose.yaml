name: aimauta-livekit

# Single-node Linux deployment. Host networking is intentional: WebRTC and
# TURN need direct UDP access and LiveKit recommends avoiding container NAT.
services:
  livekit:
    # LiveKit Server v1.13.1, linux/amd64 manifest.
    image: livekit/livekit-server:v1.13.1@sha256:4d1cc81b039b236b2b2580714cb5d89321a7313e604274f7131cf76f7a43ef80
    platform: linux/amd64
    command:
      - --config
      - /etc/livekit/livekit.yaml
      - --key-file
      - /run/secrets/livekit.keys
    network_mode: host
    restart: unless-stopped
    init: true
    user: "${LIVEKIT_RUNTIME_UID:?run init-env.sh first}:${LIVEKIT_RUNTIME_GID:?run init-env.sh first}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    volumes:
      - ./runtime/livekit.yaml:/etc/livekit/livekit.yaml:ro
      - ./runtime/livekit.keys:/run/secrets/livekit.keys:ro
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:7880/
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 15s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    # LiveKit's Caddy L4 v2.11.3 image, linux/amd64 manifest.
    image: livekit/caddyl4:v2.11.3@sha256:b7f1781f901d9d289fa1b7452fe0d051ec0aba2386bf1ff42a0ee3400de1f143
    platform: linux/amd64
    command:
      - run
      - --config
      - /etc/caddy/caddy.yaml
      - --adapter
      - yaml
    network_mode: host
    restart: unless-stopped
    init: true
    user: "${LIVEKIT_RUNTIME_UID:?run init-env.sh first}:${LIVEKIT_RUNTIME_GID:?run init-env.sh first}"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    environment:
      HOME: /data
      XDG_CONFIG_HOME: /data/config
      XDG_DATA_HOME: /data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    volumes:
      - ./runtime/caddy.yaml:/etc/caddy/caddy.yaml:ro
      - ./runtime/caddy-data:/data
    depends_on:
      livekit:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - nc
        - -z
        - 127.0.0.1
        - "443"
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 20s
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

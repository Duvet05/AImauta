worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  access_log off;
  server_tokens off;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  map $http_x_forwarded_for $client_key {
    "~^[0-9A-Fa-f:.]{2,45}$" $http_x_forwarded_for;
    default                   $binary_remote_addr;
  }

  limit_req_zone $client_key zone=api_per_client:10m rate=60r/m;
  limit_req_zone $client_key zone=session_per_client:10m rate=60r/m;
  limit_req_zone $client_key zone=materials_per_client:10m rate=300r/m;
  limit_req_zone $client_key zone=tutor_per_client:10m rate=30r/m;
  limit_conn_zone $client_key zone=connections_per_client:10m;
  limit_conn_zone $client_key zone=tutor_connections_per_client:10m;
  limit_conn_zone $server_addr zone=tutor_connections_global:1m;
  limit_req_status 429;
  limit_conn_status 429;

  upstream aimauta_app {
    server 127.0.0.1:3309;
    keepalive 16;
  }

  server {
    listen 127.0.0.1:3308;
    server_name _;

    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 60s;
    limit_conn connections_per_client 24;
    error_page 429 = @too_many_requests;

    proxy_hide_header Permissions-Policy;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Strict-Transport-Security;
    add_header Permissions-Policy "camera=(), display-capture=(), geolocation=(), microphone=(self)" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /_edge-health {
      proxy_pass http://aimauta_app/api/health;
      proxy_connect_timeout 2s;
      proxy_read_timeout 5s;
    }

    # The voice worker reaches this endpoint directly through loopback on
    # port 3309. It is never part of the public HTTP surface.
    location ^~ /api/internal/ {
      return 404;
    }

    location = /api/session {
      limit_req zone=session_per_client burst=20 nodelay;
      proxy_pass http://aimauta_app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header CF-Connecting-IP "";
      proxy_set_header X-Real-IP "";
      proxy_request_buffering on;
      proxy_buffering off;
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
    }

    location ^~ /api/tutor {
      limit_req zone=tutor_per_client burst=5 nodelay;
      limit_conn tutor_connections_per_client 2;
      limit_conn tutor_connections_global 4;
      proxy_pass http://aimauta_app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header CF-Connecting-IP "";
      proxy_set_header X-Real-IP "";
      proxy_request_buffering on;
      proxy_buffering off;
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
    }

    location ^~ /api/materials/ {
      limit_req zone=materials_per_client burst=100 nodelay;
      proxy_pass http://aimauta_app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header CF-Connecting-IP "";
      proxy_set_header X-Real-IP "";
      proxy_request_buffering on;
      proxy_buffering off;
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
    }

    location ^~ /api/ {
      limit_req zone=api_per_client burst=20 nodelay;
      proxy_pass http://aimauta_app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header CF-Connecting-IP "";
      proxy_set_header X-Real-IP "";
      proxy_request_buffering on;
      proxy_buffering off;
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
    }

    location / {
      proxy_pass http://aimauta_app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header CF-Connecting-IP "";
      proxy_set_header X-Real-IP "";
      proxy_buffering off;
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
    }

    location @too_many_requests {
      default_type application/json;
      add_header Cache-Control "no-store" always;
      add_header Retry-After "60" always;
      add_header Permissions-Policy "camera=(), display-capture=(), geolocation=(), microphone=(self)" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Cross-Origin-Opener-Policy "same-origin" always;
      add_header Strict-Transport-Security "max-age=31536000" always;
      return 429 '{"error":"Demasiadas solicitudes. Inténtalo nuevamente en un minuto."}';
    }
  }
}

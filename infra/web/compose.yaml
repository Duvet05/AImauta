name: aimauta-web

services:
  migrate:
    image: "aimauta-migrate:${AIMAUTA_RELEASE:-local}"
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: Dockerfile
      target: migrator
    network_mode: host
    restart: "no"
    read_only: true
    user: "node"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1
    env_file:
      - "${AIMAUTA_WEB_ENV_FILE:-/home/hii1sc/aimauta-runtime/web.env}"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  rag:
    image: "aimauta-rag:${AIMAUTA_RELEASE:-local}"
    platform: linux/amd64
    build:
      context: ../../services/rag-service
      dockerfile: Dockerfile
      target: production
    network_mode: host
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    group_add:
      - "${AIMAUTA_RUNTIME_GID:-1000}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    environment:
      AIMAUTA_INDEX_DIR: /srv/aimauta/indexes
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    volumes:
      - "${AIMAUTA_RUNTIME_DIR:-/home/hii1sc/aimauta-runtime}/indexes:/srv/aimauta/indexes:ro"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  app:
    image: "aimauta-web:${AIMAUTA_RELEASE:-local}"
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: Dockerfile
    network_mode: host
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    env_file:
      - "${AIMAUTA_WEB_ENV_FILE:-/home/hii1sc/aimauta-runtime/web.env}"
      - "${AIMAUTA_MODEL_ENV_FILE:-/home/hii1sc/aimauta-runtime/model-providers.env}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      rag:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 127.0.0.1
      PORT: "3309"
      AIMAUTA_RAG_SERVICE_URL: http://127.0.0.1:3310
      AIMAUTA_RAG_SERVICE_TIMEOUT_MS: "1200"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    volumes:
      - "${AIMAUTA_RUNTIME_DIR:-/home/hii1sc/aimauta-runtime}/content:/srv/aimauta/content:ro"
      - "${AIMAUTA_RUNTIME_DIR:-/home/hii1sc/aimauta-runtime}/indexes:/srv/aimauta/indexes:ro"
      - "${AIMAUTA_RUNTIME_DIR:-/home/hii1sc/aimauta-runtime}/manifests:/srv/aimauta/manifests:ro"
      - "${AIMAUTA_RUNTIME_DIR:-/home/hii1sc/aimauta-runtime}/exercise-solutions:/srv/aimauta/exercise-solutions:ro"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3309/api/health').then((response) =>
          process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  edge:
    image: "mirror.gcr.io/library/nginx@sha256:8a4f4b94275ff59d809477799cbbaf1a7ab65ed1871403d05e31fd66bdb8db82"
    platform: linux/amd64
    network_mode: host
    restart: unless-stopped
    init: true
    read_only: true
    user: "101:101"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 1
    depends_on:
      app:
        condition: service_healthy
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    volumes:
      - "./nginx.conf:/etc/nginx/nginx.conf:ro"
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O /dev/null http://127.0.0.1:3308/_edge-health"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aimauta-voice-agent"
version = "0.1.0"
description = "LiveKit voice channel for the AImauta Socratic tutor"
requires-python = ">=3.12,<3.14"
dependencies = [
  "aiohttp==3.14.1",
  "livekit-agents[codecs]==1.6.6",
  "livekit-plugins-deepgram==1.6.6",
  "livekit-plugins-silero==1.6.6",
  "pydantic-settings==2.14.2",
  "python-dotenv==1.2.2"
]

[project.optional-dependencies]
test = [
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

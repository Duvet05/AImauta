name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate catalog
        run: npm run catalog:validate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      - name: Validate deployment manifests
        run: |
          AIMAUTA_WEB_ENV_FILE="$GITHUB_WORKSPACE/infra/web/web.env.example" \
          AIMAUTA_MODEL_ENV_FILE="$GITHUB_WORKSPACE/infra/web/model-providers.env.example" \
          AIMAUTA_RUNTIME_DIR="$RUNNER_TEMP/aimauta-runtime" \
            docker compose -f infra/web/compose.yaml config --quiet
          docker run --rm --entrypoint nginx \
            -v "$GITHUB_WORKSPACE/infra/web/nginx.conf:/etc/nginx/nginx.conf:ro" \
            mirror.gcr.io/library/nginx@sha256:8a4f4b94275ff59d809477799cbbaf1a7ab65ed1871403d05e31fd66bdb8db82 \
            -t

      - name: Build production image
        run: docker build --tag aimauta-web:ci .

      - name: Test optional RAG image
        run: docker build --target test --tag aimauta-rag-test:ci services/rag-service

      - name: Build optional RAG image
        run: docker build --tag aimauta-rag:ci services/rag-service

      - name: Test voice worker image
        run: docker build --target test --tag aimauta-voice-agent-test:ci services/voice-agent

      - name: Build voice worker image
        run: docker build --tag aimauta-voice-agent:ci services/voice-agent

      - name: Smoke voice inference contract (Deepgram STT + Inworld TTS)
        run: |
          docker run --rm \
            --entrypoint python \
            --env LIVEKIT_URL=wss://ci-test.livekit.cloud \
            --env LIVEKIT_API_KEY=ci-test-key \
            --env LIVEKIT_API_SECRET=ci-test-secret \
            --env AIMAUTA_AGENT_SECRET=ci-test-agent-secret-with-32-characters \
            aimauta-voice-agent:ci \
            -c "from aimauta_voice.config import Settings; from livekit.agents import inference; s = Settings(); inference.STT(model=s.stt_model, language=s.stt_language, api_key=s.livekit_api_key, api_secret=s.livekit_api_secret); inference.TTS(model=s.tts_model, voice=s.tts_voice, language=s.tts_language, api_key=s.livekit_api_key, api_secret=s.livekit_api_secret); print('voice-inference-contract-ok')"

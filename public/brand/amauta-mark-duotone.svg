<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" role="img" aria-labelledby="amauta-mark-title amauta-mark-desc">
  <title id="amauta-mark-title">Símbolo de Amauta</title>
  <desc id="amauta-mark-desc">Rostro asimétrico de un amauta con chullo, inspirado en un grabado peruano.</desc>
  <defs>
    <path id="chevron" d="M0 0h11l10 8-10 8H0L10 8 0 0Z"/>
  </defs>

